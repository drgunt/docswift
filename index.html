<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>หนังสือเข้า · สุขภาพดิจิทัล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff8; --ink:#4a4f6a; --ink2:#8087a3; --hi:#fff; --lo:rgba(150,158,195,.45);
  --mint:#cdeee3; --peach:#fbdcd0; --lav:#dcd6f7; --sky:#cfe4f8; --butter:#faf0c4;
  --mint2:#a9dccb; --peach2:#f3bfaa; --lav2:#bcb2ee; --sky2:#a9cdee; --butter2:#ecdc92;
  --accent:#8c9cf0; --ok:#7cc9a6; --warn:#f2a98c;
  --cw:min(78vw,420px,calc((100dvh - 360px)*.78));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.raised{background:var(--bg);box-shadow:6px 6px 14px var(--lo),-6px -6px 14px var(--hi)}
.pressed{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}

/* header */
header{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 6px}
header h1{font-size:17px;font-weight:600;margin:0;line-height:1.2}
header small{display:block;font-size:12px;color:var(--ink2);font-weight:300}
header .sp{flex:1}
.ibtn{min-width:44px;height:44px;border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi)}
.ibtn:active,.ibtn.on{box-shadow:inset 2px 2px 6px var(--lo),inset -2px -2px 6px var(--hi)}
.badge{background:var(--lav2);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}

/* filters */
#filters{padding:6px 16px 8px;display:flex;flex-direction:column;gap:8px}
#filters.hide{display:none}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px;align-items:center}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;font-size:13px;background:var(--bg);box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi);color:#5d6bd0;font-weight:500}
.chip select,.chip input{font:inherit;color:inherit;background:none;border:0;outline:0;max-width:150px}
.sep{flex:none;color:var(--ink2);font-size:12px}
.u1.on,.dotu1{--c:#f0c978}.u2.on,.dotu2{--c:#f3a98b}.u3.on,.dotu3{--c:#ee8e9a}
.dotc{width:9px;height:9px;border-radius:50%;background:var(--cc)}

/* stage */
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:1100px;min-height:0;overflow:hidden}
#count{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink2);z-index:2;pointer-events:none}
.card{position:absolute;width:var(--cw);height:calc(var(--cw)*1.28);touch-action:none;transform-style:preserve-3d;will-change:transform;z-index:5;cursor:grab}
.card.s1{transform:translateY(18px) scale(.94);z-index:4;pointer-events:none;filter:saturate(.9)}
.card.s2{transform:translateY(34px) scale(.88);z-index:3;pointer-events:none;opacity:.8}
.card.enter{animation:enter .4s ease}
@keyframes enter{from{transform:translateY(18px) scale(.94);opacity:.7}}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(7deg) rotateY(-9deg);transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.card.dragging .tilt{transition:none}
.paper{position:absolute;inset:0;border-radius:26px;overflow:hidden;
  background:linear-gradient(145deg,var(--p1),var(--p2));
  box-shadow:14px 18px 30px rgba(130,138,180,.42),-8px -8px 20px rgba(255,255,255,.9),inset 2px 2px 3px rgba(255,255,255,.8),inset -3px -3px 6px rgba(0,0,0,.05)}
.t0{--p1:#e2f6ef;--p2:var(--mint);--d:#b5ddd0;--ac:#79c3a8}
.t1{--p1:#fdebe3;--p2:var(--peach);--d:#eebfae;--ac:#e99c82}
.t2{--p1:#ebe7fb;--p2:var(--lav);--d:#c6bdee;--ac:#9a8cdf}
.t3{--p1:#e3f0fc;--p2:var(--sky);--d:#b3d0ee;--ac:#76aee0}
.t4{--p1:#fcf6da;--p2:var(--butter);--d:#e6d795;--ac:#d4be5e}
.fold{position:absolute;top:0;right:0;width:64px;height:64px;background:linear-gradient(225deg,var(--bg) 50%,transparent 50%);}
.fold::after{content:"";position:absolute;top:0;right:0;width:64px;height:64px;background:linear-gradient(225deg,transparent 50%,var(--d) 50%,rgba(255,255,255,.55));border-bottom-left-radius:14px;box-shadow:-3px 3px 6px rgba(0,0,0,.12)}
.pdfbadge{position:absolute;left:22px;top:22px;padding:7px 14px;border-radius:12px;font-weight:600;letter-spacing:1.5px;font-size:15px;color:var(--ac);background:rgba(255,255,255,.35);box-shadow:inset 2px 2px 4px rgba(0,0,0,.09),inset -2px -2px 4px rgba(255,255,255,.7)}
.emb-seal{position:absolute;right:30px;top:96px;width:54px;height:54px;border-radius:50%;box-shadow:inset 3px 3px 6px rgba(0,0,0,.1),inset -3px -3px 6px rgba(255,255,255,.75)}
.emb-seal::after{content:"";position:absolute;inset:14px;border-radius:50%;box-shadow:3px 3px 5px rgba(0,0,0,.09),-2px -2px 4px rgba(255,255,255,.7)}
.lines{position:absolute;left:24px;right:24px;top:110px;display:flex;flex-direction:column;gap:13px}
.lines i{display:block;height:10px;border-radius:6px;width:100%;background:rgba(255,255,255,.2);box-shadow:inset 1px 1px 3px rgba(0,0,0,.1),1px 1px 2px rgba(255,255,255,.75)}
.lines i:nth-child(1){width:55%}
.pg{position:absolute;left:24px;bottom:18px;font-size:11px;color:var(--ink2)}
.float{position:absolute;left:-4%;right:-4%;bottom:7%;transform:translateZ(80px);padding:14px 16px 14px;border-radius:20px;
  background:rgba(255,255,255,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 18px 26px rgba(110,118,165,.35),0 4px 8px rgba(110,118,165,.15),inset 1px 1px 2px #fff;animation:bob 3.6s ease-in-out infinite}
.card:not(.s0) .float{animation:none}
@keyframes bob{50%{translate:0 -6px}}
.fl-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.date{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.urg{font-size:11px;padding:2px 9px;border-radius:10px;background:#e8ebf7;color:var(--ink2)}
.urg.u1{background:#fbeec8;color:#a38327}.urg.u2{background:#fbdccf;color:#b0613f}.urg.u3{background:#f9d3d9;color:#b04258}
.ttl{font-size:15px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.org{margin-top:6px;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);transform:translateZ(90px)}
.star{position:absolute;left:12px;top:-8px;font-size:22px;color:#e8b64a;transform:translateZ(90px);text-shadow:0 2px 4px rgba(0,0,0,.2)}
.stamp{position:absolute;top:34%;left:0;right:0;text-align:center;font-size:26px;font-weight:600;opacity:0;transform:translateZ(120px) rotate(-8deg);pointer-events:none;color:#fff;z-index:6}
.stamp span{display:inline-block;padding:8px 20px;border-radius:16px;background:var(--sc,#8c9cf0);box-shadow:0 8px 18px rgba(0,0,0,.2)}

/* drop hints */
.hint{position:absolute;z-index:8;box-shadow:0 6px 16px rgba(110,118,165,.3);opacity:.0;transition:opacity .2s,transform .2s;font-size:13px;text-align:center;border-radius:18px;padding:10px 12px;color:var(--ink2);pointer-events:none}
#stage.drag .hint{opacity:1}
.hint.active{color:#fff;transform:scale(1.08)}
#hL{left:8px;top:40%;width:84px;background:var(--mint)}#hL.active{background:var(--ok)}
#hR{right:8px;top:40%;width:84px;background:var(--lav)}#hR.active{background:var(--lav2)}
#hU{top:22px;left:50%;translate:-50% 0;width:150px;background:var(--butter)}#hU.active{background:#e0c86a}
#zones{position:absolute;left:8px;right:8px;bottom:6px;display:flex;gap:8px;z-index:8;pointer-events:none}
#zones .hint{position:static;flex:1;background:var(--sky);font-size:12px;line-height:1.25}
#zones .hint.active{background:var(--sky2)}
.hint b{display:block;font-size:18px;font-weight:500}
#empty{text-align:center;color:var(--ink2);display:none;padding:20px}
#empty .big{font-size:56px}
#empty button{margin-top:14px;padding:10px 20px;border-radius:16px}

/* bottom bar */
#bar{display:flex;gap:10px;justify-content:center;padding:6px 12px 2px;flex-wrap:nowrap}
.act{width:62px;height:62px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:1px;line-height:1.1;text-align:center;background:var(--bg);box-shadow:5px 5px 11px var(--lo),-5px -5px 11px var(--hi)}
.act:active{box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.act i{font-style:normal;font-size:20px}
#mini{display:flex;justify-content:center;gap:14px;padding:4px 12px max(12px,env(safe-area-inset-bottom))}
.mbtn{width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:600;color:var(--ink2);background:var(--bg);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi)}
.mbtn.on,.mbtn:active{box-shadow:inset 2px 2px 6px var(--lo),inset -2px -2px 6px var(--hi);color:#5d6bd0}
#bar.hide{display:none}
#tip{text-align:center;font-size:11px;color:var(--ink2);padding:0 12px 4px}

/* sheet */
#back{position:fixed;inset:0;background:rgba(80,86,120,.28);backdrop-filter:blur(3px);z-index:20;display:none;align-items:flex-end;justify-content:center}
#back.show{display:flex}
#sheet{width:min(620px,100%);max-height:88dvh;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 22px max(22px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(80,86,120,.25);animation:up .28s ease;user-select:text;-webkit-user-select:text}
@media(min-width:700px){#back{align-items:center}#sheet{border-radius:30px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--lo);margin:4px auto 14px}
#sheet h2{font-size:18px;margin:0 0 4px;line-height:1.4;font-weight:500}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.meta div{padding:10px 14px;border-radius:16px;font-size:14px}
.meta small{display:block;font-size:11px;color:var(--ink2)}
.meta .full{grid-column:1/-1}
.ai{padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#ebe7fb,#e3f0fc);font-size:14px;line-height:1.55;margin-bottom:14px}
.ai b{font-size:12px;color:#7466cc;display:block;margin-bottom:4px}
.ai ul{margin:0;padding-left:18px}
.big-btn{width:100%;padding:14px;border-radius:18px;font-weight:500;font-size:15px;background:linear-gradient(135deg,#a4b2f6,#8c9cf0);color:#fff;box-shadow:5px 6px 14px rgba(120,134,220,.45),-3px -3px 8px #fff;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.opt{padding:14px;border-radius:18px;text-align:left;font-size:14px;display:flex;gap:10px;align-items:center;background:var(--bg);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi)}
.opt:active{box-shadow:inset 2px 2px 6px var(--lo),inset -2px -2px 6px var(--hi)}
.opt i{font-style:normal;font-size:20px}
.opt small{display:block;color:var(--ink2);font-size:11px}
.lbl{font-size:12px;color:var(--ink2);margin:12px 0 8px}
textarea,select.f{width:100%;border:0;border-radius:16px;padding:12px 14px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);outline:0;resize:none}
.set-row{display:flex;align-items:center;gap:10px;margin:10px 0}.set-row span{width:96px;font-size:13px}.set-row select{flex:1}
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(150,158,195,.25);font-size:13px}
.hist div{flex:1;min-width:0}.hist small{color:var(--ink2);display:block}
.hist button{padding:6px 12px;border-radius:12px;font-size:12px}

/* viewer */
#viewer{position:fixed;inset:0;z-index:30;background:#dfe3f1;display:none;flex-direction:column}
#viewer.show{display:flex;animation:zin .3s ease}
@keyframes zin{from{transform:scale(.8);opacity:0}}
#vbar{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 8px}
#vbar .t{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vscroll{flex:1;overflow:auto;padding:6px 14px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;-webkit-overflow-scrolling:touch}
.pdfpage{width:min(100%,640px);aspect-ratio:1/1.414;background:#fff;border-radius:6px;box-shadow:0 10px 30px rgba(100,108,150,.35);padding:7% 8%;font-family:'Prompt',sans-serif;font-size:clamp(9px,1.9vw,13px);line-height:1.7;color:#222;position:relative;flex:none;cursor:zoom-out}
.pdfpage .crest{width:13%;aspect-ratio:1;border-radius:50%;margin:0 auto 2%;background:radial-gradient(circle,#e9d9a4,#c9ad5c);display:flex;align-items:center;justify-content:center;font-size:.8em;color:#7a5f17}
.pdfpage .hd{display:flex;justify-content:space-between;gap:10px}
.pdfpage p{margin:.5em 0;text-indent:2.5em;text-align:justify}.pdfpage p.ni{text-indent:0}
.pdfpage .sig{margin:8% 0 0 45%;text-align:center}
.pdfpage table{width:100%;border-collapse:collapse;margin-top:3%}.pdfpage td,.pdfpage th{border:1px solid #bbb;padding:3px 6px;text-align:left}
.pdfpage .no{position:absolute;bottom:3%;right:5%;font-size:.8em;color:#999}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));translate:-50% 0;z-index:40;background:#575d7c;color:#fff;padding:10px 12px 10px 18px;border-radius:18px;font-size:13px;display:none;align-items:center;gap:12px;box-shadow:0 10px 25px rgba(60,66,100,.4);max-width:92vw}
#toast.show{display:flex;animation:up .25s}
#toast button{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:12px;color:#fff;font-size:12px}
</style>
</head>
<body>
<header>
  <div><h1>หนังสือเข้า · กลุ่มภารกิจสุขภาพดิจิทัล</h1><small id="sub"></small></div>
  <div class="sp"></div>
  <button class="ibtn" id="bFilter" aria-label="ตัวกรอง">⚲ กรอง</button>
  <button class="ibtn" id="bHist" aria-label="ประวัติ">☰ <span class="badge" id="hc">0</span></button>
  <button class="ibtn" id="bSet" aria-label="ตั้งค่า">⚙</button>
</header>

<section id="filters" class="hide">
  <div class="row" id="rDate"></div>
  <div class="row" id="rType"></div>
</section>

<main id="stage">
  <div id="count"></div>
  <div class="hint" id="hL"><b>✓</b>รับทราบ</div>
  <div class="hint" id="hR"><b>➜</b>ส่งธุรการ</div>
  <div class="hint" id="hU"><b>⏱</b>อ่านทีหลัง</div>
  <div id="zones"></div>
  <div id="empty"><div class="big">🌿</div><p id="emptyMsg">จัดการหนังสือครบแล้ว</p><button class="raised" id="bReset">รีเซ็ตข้อมูลตัวอย่าง</button></div>
</main>

<div id="mini"><button class="mbtn" id="bMenu" aria-label="แสดงปุ่มลัด">⋯</button><button class="mbtn" id="bHelp" aria-label="วิธีใช้">?</button></div>
<nav id="bar" class="hide"></nav>

<div id="back"><div id="sheet"></div></div>
<div id="viewer"><div id="vbar"><div class="t" id="vt"></div><button class="ibtn" id="vclose">✕ ปิด</button></div><div id="vscroll"></div></div>
<div id="toast"><span id="tmsg"></span><button id="tundo">เลิกทำ</button></div>

<script>
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const TH=(d,o)=>d.toLocaleDateString('th-TH',o||{day:'numeric',month:'short',year:'2-digit'});
const THL=d=>TH(d,{day:'numeric',month:'long',year:'numeric'});
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const day0=new Date();day0.setHours(0,0,0,0);
const off=n=>{const d=new Date(day0);d.setDate(d.getDate()-n);return d};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const U=['ปกติ','ด่วน','ด่วนมาก','ด่วนที่สุด'];

/* ---------- mock data ---------- */
const DOCS=[
 {id:1,r:0,i:1,no:'สธ 0201.032/ว 1184',from:'สำนักงานปลัดกระทรวงสาธารณสุข',type:'out',urg:3,unread:1,tint:3,pages:3,
  title:'ขอเชิญประชุมชี้แจงแนวทางการดำเนินงานสุขภาพดิจิทัล ประจำปีงบประมาณ 2570',
  sum:['เชิญผู้แทนเข้าร่วมประชุมออนไลน์ 3 ต.ค. เวลา 09.30 น.','ให้ส่งรายชื่อผู้เข้าร่วมภายใน 2 วันทำการ','เตรียมข้อมูลสถานะระบบ Digital Health ของหน่วยบริการ'],
  body:['ด้วยสำนักงานปลัดกระทรวงสาธารณสุข กำหนดจัดประชุมชี้แจงแนวทางการดำเนินงานสุขภาพดิจิทัล ประจำปีงบประมาณ 2570 เพื่อให้หน่วยบริการทุกระดับมีทิศทางการพัฒนาระบบข้อมูลสุขภาพที่สอดคล้องกัน','ในการนี้ จึงขอเชิญผู้บริหารและผู้รับผิดชอบงานสารสนเทศของหน่วยงาน เข้าร่วมประชุมผ่านระบบ Video Conference ในวันศุกร์ที่ 3 ตุลาคม เวลา 09.30 – 12.00 น. และขอให้ส่งรายชื่อผู้เข้าร่วมประชุมกลับมาภายในสองวันทำการ']},
 {id:2,r:0,i:2,no:'ศธ 0512/ว 3321',from:'ศูนย์เทคโนโลยีสารสนเทศและการสื่อสาร',type:'out',urg:2,unread:1,tint:0,pages:2,

function bindDrag(c,d){

    lp=setTimeout(()=>{if(!moved){long=true;down=false;navigator.vibrate&&navigator.vibrate(15);openMore(d)}},550)};
  c.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)>8){moved=true;clearTimeout(lp);c.classList.add('dragging');stage.classList.add('drag')}
    if(!moved)return;
    c.style.transform=`translate(${dx}px,${dy}px) rotate(${clamp(dx/22,-14,14)}deg)`;
    tilt.style.transform=`rotateY(${clamp(dx/9-9,-30,30)}deg) rotateX(${clamp(-dy/14+7,-25,25)}deg)`;
    fl.style.translate=`${clamp(dx*.06,-14,14)}px ${clamp(dy*.05,-10,10)}px`;
    zone=zoneOf(dx,dy);showZone(zone,stamp)};
  const end=e=>{if(!down&&!long)return;clearTimeout(lp);const wasDown=down;down=false;if(long||!wasDown)return;
    c.classList.remove('dragging');stage.classList.remove('drag');showZone(null,stamp);
    if(!moved){tap(d);return}
    if(zone)commitZone(zone,d,false);else reset()};
  c.onpointerup=end;c.onpointercancel=()=>{down=false;clearTimeout(lp);reset();stage.classList.remove('drag');showZone(null,stamp)};
  function reset(){c.style.transition='transform .4s cubic-bezier(.2,.9,.3,1.2)';c.style.transform='';tilt.style.transform='';fl.style.translate='';c.classList.remove('dragging')}
  c._reset=reset;
}
function zoneOf(dx,dy){
  const T=80,ax=Math.abs(dx),W=stage.clientWidth;
  if(dy>T&&dy>=ax*.75){const th=Math.max(40,W*.1);return dx<-th?'downL':dx>th?'downR':'downC'}
  if(dx>T)return'right';if(dx<-T)return'left';
  if(dy<-T&&-dy>ax)return'up';return null}
const ZL={left:['✓ รับทราบ','#7cc9a6'],right:['➜ ส่งธุรการ','#9a8cdf'],up:['⏱ อ่านทีหลัง','#e0c86a']};
function showZone(z,stamp){
  ['L','R','U'].forEach(k=>$('#h'+k).classList.toggle('active',({L:'left',R:'right',U:'up'})[k]===z));
  ['downL','downC','downR'].forEach(k=>{const e=$('#h_'+k);e&&e.classList.toggle('active',k===z)});
  let txt='',col='';
  if(ZL[z]){[txt,col]=ZL[z]}else if(z){txt=TARGETS[settings[z]].short;col='#76aee0'}
  stamp.firstElementChild.textContent=txt;stamp.style.setProperty('--sc',col);stamp.style.opacity=z?1:0}

let tapTimer=null,tapAt=0;
function tap(d){
  if(tapTimer){clearTimeout(tapTimer);tapTimer=null;openViewer(d);return}
  tapTimer=setTimeout(()=>{tapTimer=null;openDetail(d)},270)}

/* ---------- commit ---------- */
let lastUndo=null,toastT=null;
function fly(c,dir,cb){
  const W=stage.clientWidth,H=stage.clientHeight;
  const m={left:[-W*1.3,0,-25],right:[W*1.3,0,25],up:[0,-H*1.1,0],down:[0,H*1.2,0],fade:[0,0,0]}[dir]||[0,H*1.2,0];
  c.style.transition='transform .38s cubic-bezier(.5,0,.8,.6),opacity .38s';
  const cur=c.style.transform&&c.style.transform!=='none'?'':'';
  c.style.transform=`translate(${m[0]}px,${m[1]}px) rotate(${m[2]}deg)${dir==='fade'?' scale(.85)':''}`;c.style.opacity=0;
  setTimeout(cb,330)}
function commit(d,label,dir,extra){
  closeSheet();
  const rec={label,t:Date.now(),extra:extra||''};
  const done=()=>{handled[d.id]=rec;save('hh',handled);refresh();toast(`${label}`,()=>{delete handled[d.id];save('hh',handled);refresh()})};
  if(topCard&&+topCard.dataset.id===d.id)fly(topCard,dir||'fade',done);else done();
}
function commitZone(z,d,viaBtn){
  if(z==='left')return commit(d,'รับทราบแล้ว','left');
  if(z==='up')return later(d,viaBtn);
  if(z==='right'){if(topCard&&!viaBtn)topCard._reset();return openAdmin(d)}
  
  const t=TARGETS[settings[z]];commit(d,`ส่งต่อ: ${t.short}`,'down');
}
function later(d){
  closeSheet();order=order.filter(i=>i!==d.id);order.push(d.id);
  if(topCard&&+topCard.dataset.id===d.id)fly(topCard,'up',()=>{refresh();toast('ย้ายไปท้ายคิว — อ่านทีหลัง')});else{refresh();toast('ย้ายไปท้ายคิว — อ่านทีหลัง')}}
function toast(msg,undo){
  $('#tmsg').textContent=msg;$('#tundo').style.display=undo?'':'none';lastUndo=undo;
  $('#toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('show'),4200)}
$('#tundo').onclick=()=>{lastUndo&&lastUndo();$('#toast').classList.remove('show')};

/* ---------- sheets ---------- */
const sheet=$('#sheet'),back=$('#back');
function openSheet(html){sheet.innerHTML='<div class="grab"></div>'+html;back.classList.add('show');sheet.scrollTop=0}
function closeSheet(){back.classList.remove('show')}
back.addEventListener('pointerdown',e=>{if(e.target===back)closeSheet()});
const markRead=d=>{if(d.unread){d.unread=0;readSet.add(d.id);save('hr',[...readSet]);const dot=document.querySelector(`.card[data-id="${d.id}"] .dot`);dot&&dot.remove()}};

function openDetail(d){
  markRead(d);
  const t=TARGETS;
  openSheet(`<span class="urg u${d.urg}">${U[d.urg]}</span> <span class="urg">${d.type==='in'?'หนังสือภายใน':'หนังสือภายนอก'}</span>
  <h2 style="margin-top:10px">${d.title}</h2>
  <div class="meta">
    <div class="pressed"><small>วันที่หนังสือเข้า</small>${THL(d.recv)}</div>
    <div class="pressed"><small>วันที่ออกหนังสือ</small>${THL(d.issue)}</div>
    <div class="pressed"><small>เลขที่หนังสือ</small>${d.no}</div>
    <div class="pressed"><small>จำนวนหน้า</small>${d.pages} หน้า</div>
    <div class="pressed full"><small>หน่วยงานที่ส่งมา</small>${d.from}</div></div>
  <div class="ai"><b>✦ สรุปโดย AI</b><ul>${d.sum.map(s=>`<li>${s}</li>`).join('')}</ul></div>
  <button class="big-btn" id="rd">📄 อ่านฉบับเต็ม</button>
  <div class="grid">
    <button class="opt" data-x="ack"><i>✓</i>รับทราบ</button>
    <button class="opt" data-x="reply"><i>↩</i>ตอบกลับ</button>
    <button class="opt" data-x="admin"><i>➜</i>ส่งธุรการ</button>
    <button class="opt" data-x="fwd"><i>⇢</i>ส่งต่อไป…</button>
    <button class="opt" data-x="circ"><i>📢</i>แจ้งเวียนทุกคน</button></div>
  <div class="lbl">ส่งต่อกลุ่มงานในการดูแล (Quick)</div>
  <div class="grid">
    <button class="opt" data-x="gA"><i>${t.gA.ic}</i><span>${t.gA.label}</span></button>
    <button class="opt" data-x="gB"><i>${t.gB.ic}</i><span>${t.gB.label}</span></button>
    <button class="opt" data-x="all"><i>${t.all.ic}</i><span>ทั้งสองกลุ่มงาน<small>ทุกกลุ่มในการดูแล</small></span></button></div>`);
  $('#rd').onclick=()=>{closeSheet();openViewer(d)};
  sheet.onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x;
    if(x==='ack')commit(d,'รับทราบแล้ว','left');
    else if(x==='reply')compose(d,'ตอบกลับ','พิมพ์ข้อความตอบกลับ…','ตอบกลับ','right');
    else if(x==='admin')openAdmin(d);
    else if(x==='fwd')openForward(d);
    else if(x==='circ')commit(d,'แจ้งเวียนทุกคนในกลุ่ม','down');
    else commit(d,`ส่งต่อ: ${t[x].short}`,'down')};
}
function compose(d,title,ph,label,dir,pre){
  openSheet(`<h2>${title}</h2><div class="lbl">${d.title}</div><textarea id="tx" rows="4" placeholder="${ph}">${pre||''}</textarea><button class="big-btn" style="margin-top:14px" id="go">ส่ง</button>`);
  setTimeout(()=>$('#tx').focus(),50);
  $('#go').onclick=()=>{const v=$('#tx').value.trim();if(!v){$('#tx').focus();return}commit(d,`${label}: ${v.length>26?v.slice(0,26)+'…':v}`,dir,v)}}
function openAdmin(d){
  openSheet(`<h2>ส่งให้ธุรการดำเนินการ</h2><div class="lbl">${d.title}</div><div class="grid" style="grid-template-columns:1fr">${ADMIN.map(a=>`<button class="opt" data-k="${a.k}"><i>${a.ic}</i>${a.label}</button>`).join('')}</div>`);
  sheet.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const a=ADMIN.find(x=>x.k===b.dataset.k);
    a.text?compose(d,a.label.replace('…',''),a.text+'…','ธุรการ: '+a.label.replace('…',''),'right'):commit(d,'ธุรการ: '+a.label,'right')}}
function openForward(d){
  const list=['ผู้อำนวยการโรงพยาบาล','รองผู้อำนวยการฝ่ายการแพทย์','หัวหน้ากลุ่มงานการพยาบาล','กลุ่มงานเภสัชกรรม','หน่วยงานอื่น…'];
  openSheet(`<h2>ส่งต่อไปยัง…</h2><div class="grid" style="grid-template-columns:1fr">${list.map(x=>`<button class="opt" data-n="${x}"><i>⇢</i>${x}</button>`).join('')}</div>`);
  sheet.onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;
    b.dataset.n.endsWith('…')?compose(d,'ส่งต่อไปยังหน่วยงานอื่น','ระบุชื่อหน่วยงาน/บุคคล…','ส่งต่อ','down'):commit(d,'ส่งต่อ: '+b.dataset.n,'down')}}
function openMore(d){
  openSheet(`<h2>ตัวเลือกอื่นๆ</h2><div class="lbl">${d.title}</div><div class="grid">
   <button class="opt" data-m="later"><i>⏱</i>อ่านทีหลัง</button>
   <button class="opt" data-m="star"><i>★</i>${starred.has(d.id)?'เลิกปักหมุด':'ปักหมุดสำคัญ'}</button>
   <button class="opt" data-m="x"><i>🔔</i>เตือนติดตามพรุ่งนี้<small>(ยังไม่เปิดใช้)</small></button>
   <button class="opt" data-m="x"><i>🖨</i>พิมพ์/แชร์<small>(ยังไม่เปิดใช้)</small></button></div>`);
  sheet.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;
    if(m==='later')later(d);else if(m==='star'){starred.has(d.id)?starred.delete(d.id):starred.add(d.id);save('hst',[...starred]);closeSheet();refresh(false)}
    else{closeSheet();toast('เมนูนี้ยังอยู่ระหว่างออกแบบ')}}}
function openSettings(){
  const opt=v=>Object.entries(TARGETS).map(([k,t])=>`<option value="${k}"${v===k?' selected':''}>${t.label}</option>`).join('');
  openSheet(`<h2>ตั้งค่าการลากลง</h2><div class="lbl">กำหนดปลายทางเมื่อลากหนังสือลงด้านล่าง</div>
   <div class="set-row"><span>ซ้ายล่าง ↙</span><select class="f" id="sL">${opt(settings.downL)}</select></div>
   <div class="set-row"><span>กลางล่าง ↓</span><select class="f" id="sC">${opt(settings.downC)}</select></div>
   <div class="set-row"><span>ขวาล่าง ↘</span><select class="f" id="sR">${opt(settings.downR)}</select></div>
   <div class="lbl">ลากซ้าย = รับทราบ · ลากขวา = ส่งธุรการ · ลากขึ้น = อ่านทีหลัง</div>
   <button class="big-btn" id="sv">บันทึก</button>`);
  sheet.onclick=null;
  $('#sv').onclick=()=>{settings={downL:$('#sL').value,downC:$('#sC').value,downR:$('#sR').value};save('hs',settings);closeSheet();refresh(false)}}
function openHist(){
  const ids=Object.keys(handled).sort((a,b)=>handled[b].t-handled[a].t);
  openSheet(`<h2>ประวัติการดำเนินการ (${ids.length})</h2>`+(ids.length?ids.map(id=>`<div class="hist"><div>${byId(+id).title.slice(0,60)}…<small>→ ${handled[id].label}</small></div><button class="raised" data-u="${id}">เลิกทำ</button></div>`).join(''):'<p style="color:var(--ink2)">ยังไม่มีรายการ</p>'));
  sheet.onclick=e=>{const b=e.target.closest('[data-u]');if(!b)return;delete handled[b.dataset.u];save('hh',handled);refresh();openHist()}}
$('#bMenu').onclick=()=>{$('#bar').classList.toggle('hide');$('#bMenu').classList.toggle('on')};
$('#bHelp').onclick=()=>{openSheet(`<h2>วิธีใช้งาน</h2><div class="meta" style="grid-template-columns:1fr">
<div class="pressed">👈 <b>ลากซ้าย</b> = รับทราบ</div><div class="pressed">👉 <b>ลากขวา</b> = ส่งธุรการ (เลือกงานที่ให้ทำ)</div>
<div class="pressed">👇 <b>ลากลง</b> = ส่งกลุ่มงาน (ซ้ายล่าง / กลางล่าง / ขวาล่าง ตั้งค่าได้ที่ ⚙)</div><div class="pressed">👆 <b>ลากขึ้น</b> = อ่านทีหลัง</div>
<div class="pressed"><b>แตะ 1 ที</b> = รายละเอียด · <b>แตะ 2 ที</b> = อ่านฉบับเต็ม</div><div class="pressed"><b>กดค้าง</b> = ตัวเลือกอื่นๆ</div>
<div class="pressed">⋯ = แสดง/ซ่อนปุ่มลัดด้านล่าง</div></div>`);sheet.onclick=null};
$('#bSet').onclick=openSettings;$('#bHist').onclick=openHist;
$('#bReset').onclick=()=>{handled={};readSet=new Set();save('hh',handled);save('hr',[]);DOCS.forEach(d=>d.unread=[1,2,3,5].includes(d.id)?1:0);F.range='all';F.urg.clear();F.type='all';F.unread=false;F.from=F.to='';refresh()};

/* ---------- full viewer ---------- */
let vOpened=0;
function openViewer(d){
  markRead(d);vOpened=Date.now();
  $('#vt').textContent=d.title;
  const head=n=>`<div class="crest">ตรา</div><div class="hd"><div>ที่ ${d.no}</div><div style="text-align:right">${d.from}<br>ถนนสุขภาพ เขตตัวอย่าง 10000</div></div><div style="text-align:right;margin-top:.4em">${THL(d.issue)}</div>`;
  const p1=`<div class="pdfpage">${head()}<p class="ni"><b>เรื่อง</b>&nbsp; ${d.title}</p><p class="ni"><b>เรียน</b>&nbsp; หัวหน้ากลุ่มภารกิจสุขภาพดิจิทัล โรงพยาบาลตัวอย่าง</p><p class="ni"><b>สิ่งที่ส่งมาด้วย</b>&nbsp; รายละเอียดประกอบ จำนวน 1 ชุด</p>${d.body.map(b=>`<p>${b}</p>`).join('')}<p>จึงเรียนมาเพื่อโปรดทราบและพิจารณาดำเนินการต่อไป</p><div class="sig">ขอแสดงความนับถือ<br><br>( ผู้ลงนามตัวอย่าง )<br>ผู้อำนวยการ/หัวหน้าหน่วยงาน</div><div class="no">1 / ${Math.max(d.pages,2)}</div></div>`;
  const p2=`<div class="pdfpage"><p class="ni"><b>รายละเอียดประกอบ</b></p><table><tr><th>ลำดับ</th><th>รายการ</th><th>กำหนด</th></tr>${d.sum.map((s,i)=>`<tr><td>${i+1}</td><td>${s}</td><td>${TH(new Date(+d.recv+(i+2)*864e5))}</td></tr>`).join('')}</table><p class="ni" style="margin-top:3em;color:#999">— เอกสารตัวอย่าง (Mockup) —</p><div class="no">2 / ${Math.max(d.pages,2)}</div></div>`;
  $('#vscroll').innerHTML=p1+p2;$('#vscroll').scrollTop=0;
  $('#viewer').classList.add('show');
}
function closeViewer(){$('#viewer').classList.remove('show')}
$('#vclose').onclick=closeViewer;
$('#vscroll').onclick=e=>{if(Date.now()-vOpened<450)return;if(String(getSelection()))return;closeViewer()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeViewer();closeSheet()}});

refresh();
</script>
</body>
</html>
